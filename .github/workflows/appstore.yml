name: App Store

# Builds the App Store variant from the upstream commit, applies the App Store
# bundle ID at build time, signs it with the distribution certificate and the two
# App Store provisioning profiles, and uploads the result to TestFlight.
# Nothing is committed, so this repository keeps the upstream bundle ID.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion override, leave empty to use the workflow run number"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    # The repository variable turns the workflow on after the environment and
    # secrets exist, so forks and early tags do not fail on missing secrets
    if: vars.APPSTORE_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    environment: appstore
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xtool

      - name: Apply the App Store bundle ID
        env:
          APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
        run: |
          if [[ -z "$APPSTORE_BUNDLE_ID" ]]; then
            echo "::error::Set the APPSTORE_BUNDLE_ID repository variable"
            exit 1
          fi
          python3 Tools/appstore/apply_bundle_id.py "$APPSTORE_BUNDLE_ID"
          git diff --stat

      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
            for plist in Support/App-Info.plist Support/Widget-Info.plist; do
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
            done
            echo "CFBundleShortVersionString $version"
          else
            echo "::warning::Tag $GITHUB_REF_NAME does not start with vMAJOR.MINOR.PATCH, keeping the version from Info.plist"
          fi

      - name: Build and verify unsigned IPAs
        run: |
          Tools/build-livecontainer.sh
          Tools/verify-ipa.sh

      - name: Prepare signing assets
        env:
          CERT_P12_B64: ${{ secrets.APPSTORE_CERT_P12_BASE64 }}
          MAIN_PROFILE_B64: ${{ secrets.APPSTORE_MAIN_PROFILE_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.APPSTORE_WIDGET_PROFILE_BASE64 }}
          P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          assets="$RUNNER_TEMP/appstore"
          mkdir -p "$assets"
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$assets/distribution.p12"
          printf '%s' "$MAIN_PROFILE_B64" | base64 --decode > "$assets/MicYou-AppStore.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_B64" | base64 --decode > "$assets/MicYouWidget-AppStore.mobileprovision"
          printf '%s' "$P8_B64" | base64 --decode > "$assets/AuthKey.p8"
          chmod 600 "$assets"/*

      - name: Sign the IPA
        env:
          CERT_P12: ${{ runner.temp }}/appstore/distribution.p12
          P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          MAIN_PROFILE: ${{ runner.temp }}/appstore/MicYou-AppStore.mobileprovision
          WIDGET_PROFILE: ${{ runner.temp }}/appstore/MicYouWidget-AppStore.mobileprovision
          IPA_IN: xtool/MicYou.ipa
          IPA_OUT: xtool/MicYou-AppStore.ipa
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: Tools/sign-ipa.sh

      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f xtool/MicYou-AppStore.ipa -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/appstore/AuthKey.p8"
          xcrun altool --upload-app -f xtool/MicYou-AppStore.ipa -t ios \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/appstore/AuthKey.p8"
