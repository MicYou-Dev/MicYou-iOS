name: Compile icon
# actool only runs on macOS, copy the artifact into Resources/AppIcon
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actool:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The same choice as .github/actions/setup-xtool, a beta actool may write an icon released iOS cannot read
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
      - name: Compile MicYou.icon for iOS
        run: |
          mkdir -p out
          xcrun actool \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist out/partial.plist \
            --app-icon MicYou --include-all-app-icons \
            --development-region en \
            --target-device iphone --target-device ipad \
            --minimum-deployment-target 17.0 \
            --platform iphoneos \
            --compile out \
            Resources/AppIcon/MicYou.icon
          ls -la out
          cat out/partial.plist
          xcrun assetutil --info out/Assets.car | head -80
      - uses: actions/upload-artifact@v7
        with:
          name: ios-assets
          path: out/
