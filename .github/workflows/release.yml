name: Release
# Pushing a tag such as v1.2.0 or v1.2.0-beta.1 builds unsigned IPAs on macOS and publishes them,
# then signs the TestFlight IPA and uploads it once the appstore environment is set up (docs/APPSTORE.md)
# Running it by hand only builds, the IPAs are kept as workflow artifacts, and can upload to TestFlight too
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testflight:
        description: Also upload this build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: macos-latest
    # A cold build takes about ten minutes, anything far beyond that is a hang
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for the build number and the release notes
          fetch-depth: 0

      - uses: ./.github/actions/setup-xtool

      - name: Set version
        id: version
        run: |
          # The widget extension must carry the same version as the app
          PLISTS=(Support/App-Info.plist Support/Widget-Info.plist)
          set_all() { for p in "${PLISTS[@]}"; do /usr/libexec/PlistBuddy -c "Set :$1 $2" "$p"; done; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH with an optional -suffix"
              exit 1
            fi
            # The bundle version only takes numbers, a -beta.1 suffix stays in the release name
            SHORT="${BASH_REMATCH[1]}"
            VERSION="${TAG#v}"
            PRERELEASE=$([ -n "${BASH_REMATCH[2]}" ] && echo true || echo false)
            set_all CFBundleShortVersionString "$SHORT"
          else
            SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${PLISTS[0]}")
            VERSION="$SHORT-dev.$(git rev-parse --short HEAD)"
            PRERELEASE=true
          fi
          # Grows with every commit, so a newer build always installs over an older one
          BUILD=$(git rev-list --count HEAD)
          set_all CFBundleVersion "$BUILD"
          echo "MicYou $VERSION ($SHORT, build $BUILD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build IPAs
        run: Tools/build-livecontainer.sh
        timeout-minutes: 20

      - name: Verify
        run: Tools/verify-ipa.sh

      # Converted here so the Xcode keys it adds come from the Xcode that built it, signing waits for the testflight job
      - name: TestFlight IPA
        env:
          TESTFLIGHT_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
          TESTFLIGHT_IPA: xtool/MicYou.ipa
        run: |
          [ -n "$TESTFLIGHT_BUNDLE_ID" ] || unset TESTFLIGHT_BUNDLE_ID
          Tools/build-testflight.sh

      - name: Collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp xtool/MicYou.ipa "dist/MicYou-$VERSION.ipa"
          cp xtool/MicYou-LiveContainer.ipa "dist/MicYou-$VERSION-LiveContainer.ipa"
          (cd dist && shasum -a 256 *.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: MicYou-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: MicYou-${{ steps.version.outputs.version }}-TestFlight
          path: xtool/MicYou-TestFlight.ipa
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: MicYou-${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        run: |
          # Commits since the previous version tag, the first release lists the whole history
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$RANGE"
            echo
            # English like the rest, the app translates the notes from English
            echo "## Acknowledgements"
            echo
            echo "- Thanks to [@ShirazuNagisa](https://github.com/ShirazuNagisa) for bringing MicYou to TestFlight with their paid Apple Developer account"
            echo
            echo "## Files"
            echo
            echo "- \`MicYou-*.ipa\` unsigned, sign and install with AltStore, SideStore, Sideloadly or xtool"
            echo "- \`MicYou-*-LiveContainer.ipa\` without the widget extension, for LiveContainer"
            echo "- \`SHA256SUMS.txt\` checksums of both"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          FLAGS=()
          [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$VERSION" \
            --notes-file notes.md \
            "${FLAGS[@]}"

  testflight:
    needs: [build, publish]
    # After the release is published, or after a manual build that asked for it; the repository
    # variable stays unset until the appstore environment has its secrets, so forks skip this
    if: >-
      !cancelled() && vars.APPSTORE_ENABLED == 'true' && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.testflight))
    runs-on: macos-latest
    timeout-minutes: 30
    # The only job that can read the signing secrets
    environment: appstore
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: MicYou-${{ needs.build.outputs.version }}-TestFlight
          path: xtool

      - name: Prepare signing assets
        env:
          CERT_P12_B64: ${{ secrets.APPSTORE_CERT_P12_BASE64 }}
          MAIN_PROFILE_B64: ${{ secrets.APPSTORE_MAIN_PROFILE_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.APPSTORE_WIDGET_PROFILE_BASE64 }}
          P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          assets="$RUNNER_TEMP/appstore"
          mkdir -p "$assets"
          printf '%s' "$CERT_P12_B64" | base64 --decode > "$assets/distribution.p12"
          printf '%s' "$MAIN_PROFILE_B64" | base64 --decode > "$assets/MicYou-AppStore.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_B64" | base64 --decode > "$assets/MicYouWidget-AppStore.mobileprovision"
          printf '%s' "$P8_B64" | base64 --decode > "$assets/AuthKey.p8"
          chmod 600 "$assets"/*

      - name: Sign
        env:
          CERT_P12: ${{ runner.temp }}/appstore/distribution.p12
          P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          MAIN_PROFILE: ${{ runner.temp }}/appstore/MicYou-AppStore.mobileprovision
          WIDGET_PROFILE: ${{ runner.temp }}/appstore/MicYouWidget-AppStore.mobileprovision
        run: Tools/sign-ipa.sh

      - name: Validate and upload
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for action in --validate-app --upload-app; do
            xcrun altool "$action" -f xtool/MicYou-AppStore.ipa -t ios \
              --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
              --p8-file-path "$RUNNER_TEMP/appstore/AuthKey.p8"
          done

      - name: Remove signing assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/appstore"
