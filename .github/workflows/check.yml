name: Check
# The app itself needs a Darwin SDK, these run on plain Linux
on:
  # Pull requests cover other branches, pushing a branch with an open PR would otherwise run everything twice
  push:
    branches:
      - swiftui
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  # Release runs the same checks before building
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Packages/*/.build
          # Only the sources, the key is computed again after the tests and .build is written by root in the container
          key: swiftpm-${{ runner.os }}-swift6.2-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Sources/**', 'Packages/*/Tests/**') }}
          restore-keys: swiftpm-${{ runner.os }}-swift6.2-
      - name: Protocol tests
        run: swift test --package-path Packages/MicYouProtocol
      - name: Core tests
        run: swift test --package-path Packages/MicYouCore
  strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Localization tables
        run: python3 Tools/check-strings.py
