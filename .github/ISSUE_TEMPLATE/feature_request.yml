name: 功能建议 / Feature request
description: 希望 MicYou iOS 版增加或改进的功能 / Something MicYou for iOS could add or do better
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        支持中文或英文反馈。需要电脑端配合的功能请同时在 [MicYou](https://github.com/MicYou-Dev/MicYou/issues) 提出。
        Chinese or English is welcome. Features that require desktop support should also be requested at [MicYou](https://github.com/MicYou-Dev/MicYou/issues).
  - type: textarea
    id: feature
    attributes:
      label: 想要的功能 / The feature
      description: 希望 MicYou 能做到什么 / What you would like MicYou to do
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Why it helps
      description: 在什么情况下会用到 / When you would use it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的做法 / Alternatives
      description: 现在怎么解决，或者其他 App 的做法 / How you handle it today, or how other apps do it
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 从 App 打开时自动填写 / Filled in when opened from the app
      render: text
  - type: checkboxes
    id: checked
    attributes:
      label: 已确认 / Checklist
      options:
        - label: 搜索过已有的问题，没有重复 / Searched existing issues and found no duplicate
          required: true
